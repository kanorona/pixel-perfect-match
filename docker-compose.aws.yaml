# AWS environment stack for the single EC2 instance created by CloudFormation.
# Only Caddy is reachable from the host. PostgreSQL and FastAPI remain on the
# private Compose network. Keep exactly one app replica: realtime rooms live in
# the FastAPI process memory.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    # CI may build this service locally; AWS deployments always set an immutable
    # ECR digest in BLUEPRINT_IMAGE and use --no-build.
    image: ${BLUEPRINT_IMAGE:-blueprint-interviews-app:local}
    build:
      context: .
      args:
        BLUEPRINT_REVISION: ${BLUEPRINT_REVISION:-unknown}
    environment:
      BLUEPRINT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BLUEPRINT_ENV: ${BLUEPRINT_ENV:-production}
      BLUEPRINT_SEED_DEMO: "false"
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      BLUEPRINT_ORIGIN_TOKEN: ${BLUEPRINT_ORIGIN_TOKEN:?set the private origin token in .env}
    ports:
      - "80:80"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
