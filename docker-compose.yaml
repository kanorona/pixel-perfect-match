services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdip
      POSTGRES_PASSWORD: sdip
      POSTGRES_DB: sdip
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    environment:
      BLUEPRINT_DATABASE_URL: postgresql://sdip:sdip@db:5432/sdip
    ports:
      - "8100:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
    name: interview-canvas-pgdata
