services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdip
      POSTGRES_PASSWORD: sdip
      POSTGRES_DB: sdip
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    environment:
      BLUEPRINT_DATABASE_URL: postgresql://sdip:sdip@db:5432/sdip
      BLUEPRINT_ENV: development
      BLUEPRINT_SEED_DEMO: "true"
    ports:
      - "127.0.0.1:8100:8001"
    networks:
      default:
        aliases:
          - blueprint.test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    environment:
      E2E_BASE_URL: http://blueprint.test:8001
    ipc: host
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
    name: interview-canvas-pgdata
