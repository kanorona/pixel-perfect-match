name: Roll back production to a previous image

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID whose immutable image should be restored
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blueprint-production-promotion
  cancel-in-progress: false

jobs:
  select-release:
    name: Verify previous immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      digest: ${{ steps.release.outputs.digest }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      ECR_REPOSITORY_URI: ${{ vars.BLUEPRINT_ECR_REPOSITORY_URI }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - name: Require a successful main push CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")
          RUN="$run" python - <<'PY'
          import json, os
          run = json.loads(os.environ['RUN'])
          assert run.get('path') == '.github/workflows/ci.yml'
          assert run.get('event') == 'push'
          assert run.get('head_branch') == 'main'
          assert run.get('conclusion') == 'success'
          print(f'Verified rollback source {run["html_url"]}')
          PY

      - name: Download the selected run's immutable release manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-manifest
          path: .release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Validate rollback revision, tag and digest
        id: release
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('.release/deployment-manifest.json').read_text())
          assert re.fullmatch(r'[a-f0-9]{40}', manifest.get('revision', ''))
          assert manifest.get('repository_uri') == os.environ['ECR_REPOSITORY_URI']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', manifest.get('digest', ''))
          assert re.fullmatch(r'\d{8}-\d{6}-[a-f0-9]{7}', manifest.get('tag', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key in ('revision', 'digest', 'tag'):
                  output.write(f'{key}={manifest[key]}\n')
          PY

  rollback:
    name: Restore previous image in Production
    needs: select-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      DEPLOY_REVISION: ${{ needs.select-release.outputs.revision }}
      DEPLOY_IMAGE_DIGEST: ${{ needs.select-release.outputs.digest }}
      DEPLOY_INSTANCE_ID: ${{ vars.BLUEPRINT_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.BLUEPRINT_DEPLOY_DOCUMENT }}
      PUBLIC_URL: ${{ vars.BLUEPRINT_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Production rollback settings
        env:
          ROLE_ARN: ${{ vars.BLUEPRINT_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$DEPLOY_IMAGE_DIGEST"
          test "$DEPLOY_INSTANCE_ID" = "i-088ca3bcb29814cef"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BLUEPRINT_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: rollback-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: '397291427074'
      - name: Restore the selected immutable image
        run: bash ci/deploy.sh
      - name: Verify Production HTTPS, readiness and exact revision
        run: python ci/check_health.py "$PUBLIC_URL" "$DEPLOY_REVISION"
      - name: Record restored release
        env:
          IMAGE_TAG: ${{ needs.select-release.outputs.tag }}
        run: printf 'Restored Production revision `%s`, tag `%s`, digest `%s`.\n' "$DEPLOY_REVISION" "$IMAGE_TAG" "$DEPLOY_IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
