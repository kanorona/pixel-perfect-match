name: pixel-perfect-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "10.44.0.10:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector/config-aws.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /opt/observability-data/pki:/etc/otelcol-contrib/pki:ro
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /opt/observability-data/prometheus:/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 320M

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - /opt/observability-data/loki:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - /opt/observability-data/tempo:/var/tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 320M

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?load the protected Grafana env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /opt/observability-data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 320M
