AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Reusable Blueprint Interviews environment on one EC2 instance. Separate
  CloudFormation stacks isolate development and production while preserving
  the CloudFront, Caddy, FastAPI and PostgreSQL architecture.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: CloudFront -> EC2/Caddy -> FastAPI -> PostgreSQL on a stack-local Docker volume
    must:
      - Deploy development and production as different stacks with different origin tokens.
      - Never copy or reference a PostgreSQL volume or generated database password across environments.
      - Keep EC2 reachable on port 80 only through the CloudFront origin-facing prefix list.
    ref:
      - at: docs/environments.md
        has: environment parameters, isolation model, costs and future deployment procedure
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment
        Parameters: [EnvironmentName]
      - Label:
          default: Source
        Parameters: [RepoUrl, RepoRef]
      - Label:
          default: Compute
        Parameters: [InstanceType, RootVolumeSize, LatestAmiId, BuildxVersion]
      - Label:
          default: Network
        Parameters: [VpcCidr, PublicSubnetCidr, CloudFrontPrefixListId, OriginVerifyToken]

Parameters:
  EnvironmentName:
    Type: String
    Default: development
    AllowedValues: [development, production]
    Description: Logical environment. Use a separate stack and private parameters file for each value.

  RepoUrl:
    Type: String
    Default: https://github.com/kanorona/pixel-perfect-match.git
    Description: Public GitHub repository cloned by the instance.
    AllowedPattern: ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(?:\.git)?$

  RepoRef:
    Type: String
    Default: main
    Description: Branch, tag, or commit to deploy.
    AllowedPattern: ^[A-Za-z0-9._/-]+$

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.small is suitable for the classroom deployment.

  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 16
    MaxValue: 100
    Description: GiB for Docker images, build cache, and PostgreSQL data.

  BuildxVersion:
    Type: String
    Default: v0.36.1
    AllowedPattern: ^v[0-9]+\.[0-9]+\.[0-9]+$

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI from the public SSM parameter.

  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: ^(?:10(?:\.[0-9]{1,3}){3}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2}|192\.168(?:\.[0-9]{1,3}){2})/(?:1[6-9]|2[0-8])$
    Description: Private VPC CIDR. Production uses a different range from development.

  PublicSubnetCidr:
    Type: String
    Default: 10.42.0.0/24
    AllowedPattern: ^(?:10(?:\.[0-9]{1,3}){3}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2}|192\.168(?:\.[0-9]{1,3}){2})/(?:2[0-8])$
    Description: Public subnet CIDR contained within VpcCidr.

  CloudFrontPrefixListId:
    Type: String
    Description: >-
      Regional ID of com.amazonaws.global.cloudfront.origin-facing. The deploy
      script resolves it automatically so port 80 accepts only CloudFront.
    AllowedPattern: ^pl-[a-f0-9]+$

  OriginVerifyToken:
    Type: String
    NoEcho: true
    MinLength: 64
    MaxLength: 64
    AllowedPattern: ^[a-f0-9]{64}$
    Description: >-
      Private random 256-bit origin token, supplied outside Git. No default.
      Privileged readers of EC2 UserData or CloudFront origin configuration can
      retrieve it; NoEcho only masks parameter displays.

Rules:
  EnvironmentNetworkIsolation:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref EnvironmentName, development]
            - !Equals [!Ref VpcCidr, 10.42.0.0/16]
            - !Equals [!Ref PublicSubnetCidr, 10.42.0.0/24]
          - !And
            - !Equals [!Ref EnvironmentName, production]
            - !Equals [!Ref VpcCidr, 10.43.0.0/16]
            - !Equals [!Ref PublicSubnetCidr, 10.43.0.0/24]
        AssertDescription: EnvironmentName must use its reviewed, non-overlapping VPC and subnet CIDRs.

Conditions:
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw
        - Key: Environment
          Value: !Ref EnvironmentName

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public
        - Key: Environment
          Value: !Ref EnvironmentName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront origin-facing servers only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: CloudFront to Caddy
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the Blueprint instance use AWS Systems Manager.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-role
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-eip
        - Key: Environment
          Value: !Ref EnvironmentName

  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - PublicSubnetRouteTableAssociation
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One educational app process; disposable PostgreSQL on encrypted root
          disk. Local health checks gate creation before EIP and CloudFront.
        must:
          - Signal success only after database, API, frontend and origin checks pass.
          - Keep network routes ready before bootstrap; initial public IP permits downloads.
          - Keep demo seeding disabled and never log the origin token.
          - Root disk data is intentionally disposable when the instance is deleted.
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Environment
          Value: !Ref EnvironmentName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 077
          touch /var/log/blueprint-bootstrap.log
          chmod 0600 /var/log/blueprint-bootstrap.log
          exec > >(tee -a /var/log/blueprint-bootstrap.log) 2>&1

          finish() {
            result=$?
            trap - EXIT
            rm -f /run/blueprint-origin.curl
            if [ ! -x /opt/aws/bin/cfn-signal ]; then
              echo "cfn-signal unavailable; CreationPolicy will time out" >&2
              exit 1
            fi
            for attempt in $(seq 1 5); do
              if timeout 30 /opt/aws/bin/cfn-signal --exit-code "$result" \
                --stack '${AWS::StackName}' --resource Instance --region '${AWS::Region}'; then
                exit "$result"
              fi
              sleep 5
            done
            echo "Could not deliver resource signal; CreationPolicy will time out" >&2
            exit 1
          }
          trap finish EXIT

          # Bound all bootstrap work to 24 minutes, leaving time to signal within PT30M.
          timeout --signal=TERM --kill-after=15s 1440 bash <<'BOOTSTRAP'
          set -euo pipefail
          umask 077
          retry() {
            for attempt in $(seq 1 4); do
              if "$@"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          echo "=== install signaling helper ==="
          retry timeout 120 dnf install -y aws-cfn-bootstrap

          echo "=== install Docker and Git ==="
          retry timeout 180 dnf install -y docker git openssl
          systemctl enable --now docker
          usermod -aG docker ec2-user

          echo "=== install Docker Compose and buildx ==="
          install -d /usr/local/lib/docker/cli-plugins
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 120 \
            "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 120 \
            "https://github.com/docker/buildx/releases/download/${BuildxVersion}/buildx-${BuildxVersion}.linux-amd64" \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose \
            /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "=== add swap for the Node frontend build ==="
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile none swap sw 0 0" >> /etc/fstab
          fi

          echo "=== clone source ==="
          install -d -m 0700 /opt/blueprint
          cd /opt/blueprint
          git init
          git remote add origin '${RepoUrl}'
          retry timeout 120 git fetch --depth 1 origin '${RepoRef}'
          git checkout --detach FETCH_HEAD

          echo "=== generate local database secrets ==="
          umask 077
          {
            echo "POSTGRES_USER=blueprint"
            echo "POSTGRES_DB=blueprint_${EnvironmentName}"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "BLUEPRINT_ENV=${EnvironmentName}"
            echo "BLUEPRINT_REVISION=${RepoRef}"
            printf '%s\n' 'BLUEPRINT_ORIGIN_TOKEN=${OriginVerifyToken}'
          } > .env
          chmod 0600 .env

          # curl reads the sensitive header from a private file, not process arguments.
          printf 'header = "X-Blueprint-Origin-Token: %s"\n' '${OriginVerifyToken}' > /run/blueprint-origin.curl

          echo "=== build and start application ==="
          docker compose -f docker-compose.aws.yaml config --quiet
          retry timeout 180 docker compose -f docker-compose.aws.yaml pull postgres caddy
          timeout 900 docker compose -f docker-compose.aws.yaml build app
          docker compose -f docker-compose.aws.yaml up -d --no-build

          echo "=== wait for database, API, frontend and origin protection ==="
          for attempt in $(seq 1 90); do
            if docker compose -f docker-compose.aws.yaml exec -T postgres sh -c \
                'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 \
              && curl -fsS --connect-timeout 2 --max-time 5 --config /run/blueprint-origin.curl \
                http://127.0.0.1/health/ready >/dev/null \
              && curl -fsS --connect-timeout 2 --max-time 5 --config /run/blueprint-origin.curl \
                http://127.0.0.1/ >/dev/null \
              && [ "$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' \
                http://127.0.0.1/health/ready)" = 403 ] \
              && [ "$(curl -s --connect-timeout 2 --max-time 5 -H 'X-Blueprint-Origin-Token: invalid' \
                -o /dev/null -w '%{http_code}' http://127.0.0.1/health/ready)" = 403 ]; then
              rm -f /run/blueprint-origin.curl
              echo "Blueprint is ready"
              exit 0
            fi
            sleep 5
          done
          rm -f /run/blueprint-origin.curl
          echo "Application did not become healthy" >&2
          docker compose -f docker-compose.aws.yaml ps
          exit 1
          BOOTSTRAP

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ElasticIpAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: HTTPS edge and shared origin header; avoids extra services for this demo.
        must:
          - Caddy must require the same private OriginVerifyToken on every request.
          - Keep origin restricted to the CloudFront prefix list; token is not viewer authentication.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} - Blueprint Interviews
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: blueprint-instance
            OriginCustomHeaders:
              - HeaderName: X-Blueprint-Origin-Token
                HeaderValue: !Ref OriginVerifyToken
            DomainName: !Sub
              - ec2-${DashedIp}.${DnsSuffix}
              - DashedIp: !Join ["-", !Split [".", !Ref ElasticIp]]
                DnsSuffix: !If
                  - IsUsEast1
                  - compute-1.amazonaws.com
                  - !Sub ${AWS::Region}.compute.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: blueprint-instance
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        CustomErrorResponses:
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  EnvironmentName:
    Description: Logical environment represented by this independent stack.
    Value: !Ref EnvironmentName

  ApplicationUrl:
    Description: HTTPS URL served by CloudFront. Allow several minutes after creation.
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  InstanceId:
    Value: !Ref Instance

  ElasticIp:
    Description: Stable origin IP. Port 80 accepts only CloudFront.
    Value: !Ref ElasticIp

  SessionManagerCommand:
    Description: Open a shell without SSH or an EC2 key pair.
    Value: !Sub aws ssm start-session --target ${Instance}

  BootstrapLog:
    Description: Inspect this file through Session Manager if startup fails.
    Value: /var/log/blueprint-bootstrap.log
