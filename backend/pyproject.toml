[project]
name = "blueprint-backend"
version = "0.1.0"
description = "FastAPI backend with SQLAlchemy persistence compatible with the Blueprint frontend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-sdk>=1.45.2,<1.46",
  "opentelemetry-instrumentation-fastapi>=0.66b2,<0.67",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b2,<0.67",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
